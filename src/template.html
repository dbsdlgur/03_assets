<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="format-detection" content="telephone=no,email=no,address=no,date=no">
<title>Money</title>
<link rel="stylesheet" href="template.css">
</head>
<body>
<main class="sheet-main">
 <header class="app-header">
  <div class="top">
   <div class="tab-bar">
    <div role="tablist" aria-label="메뉴">
     <button role="tab" id="tab-money" aria-controls="panel-money" aria-selected="true" data-tab="money" aria-label="Money"><span class="money-title-full">Money</span><span class="money-title-initial" aria-hidden="true">M</span></button>
    </div>
   </div>
   <div class="save-meta">
    <time id="updatedAt"></time>
    <span id="saveStatus" role="status" aria-live="polite" hidden></span>
   </div>
   <div class="actions">
    <div class="sheet-view-bar" role="toolbar" aria-label="시트 확대 및 축소">
     <span class="sheet-action-label">확대·축소</span>
     <button id="zoomOutBtn" type="button" aria-label="시트 축소" title="시트 축소">−</button>
     <button id="zoomResetBtn" type="button" aria-label="시트 배율 100%로 초기화" title="100%로 초기화">100%</button>
     <button id="zoomInBtn" type="button" aria-label="시트 확대" title="시트 확대">+</button>
    </div>
    <button id="editLockBtn" type="button" aria-pressed="false" aria-controls="sheetToolbar sheetTabActions" title="편집 잠금">잠금</button>
    <button id="saveBtn" type="button" class="primary">저장</button>
   </div>
  </div>
 </header>
 <section role="tabpanel" id="panel-money" aria-labelledby="tab-money" class="money-panel">
  <div id="sheetToolbar" class="sheet-toolbar">
   <div class="sheet-actions" role="toolbar" aria-label="행·열 편집">
    <div class="sheet-action-group" role="group" aria-label="행 편집">
     <span class="sheet-action-label">행</span>
     <button id="addRowBtn" type="button" aria-label="행 추가" title="행 추가">+</button>
     <button id="delRowBtn" type="button" aria-label="행 삭제" title="행 삭제">−</button>
    </div>
    <div class="sheet-action-group" role="group" aria-label="열 편집">
     <span class="sheet-action-label">열</span>
     <button id="addColBtn" type="button" aria-label="열 추가" title="열 추가">+</button>
     <button id="delColBtn" type="button" aria-label="열 삭제" title="열 삭제">−</button>
    </div>
    <div class="sheet-action-group" role="group" aria-label="행·열 숨김">
     <span class="sheet-action-label">숨김</span>
     <button id="hideRowBtn" type="button" aria-label="행 숨김">행</button>
     <button id="hideColBtn" type="button" aria-label="열 숨김">열</button>
     <button id="unhideAllBtn" type="button" aria-label="숨김 해제" disabled>해제 (0)</button>
    </div>
   </div>
   <div class="sheet-options" role="toolbar" aria-label="보기 설정 및 셀 테마">
    <button id="freezeRowBtn" type="button" aria-pressed="false">첫행 고정</button>
    <button id="negThemeBtn" type="button" aria-pressed="true">0 미만 강조</button>
    <button id="wonBtn" type="button" aria-pressed="false" title="선택한 셀을 원(₩) 단위로 표시">₩ 원</button>
    <div class="theme-bar" role="toolbar" aria-label="셀 테마 적용">
     <span class="theme-label">테마</span>
     <button type="button" class="theme-swatch theme-amber" data-theme="amber" title="노랑 테마" aria-label="노랑 테마"></button>
     <button type="button" class="theme-swatch theme-lightyellow" data-theme="lightyellow" title="옅은 노랑 테마 (#F8ECA5)" aria-label="옅은 노랑 테마"></button>
     <button type="button" class="theme-swatch theme-green" data-theme="green" title="초록 테마" aria-label="초록 테마"></button>
     <button type="button" class="theme-swatch theme-lightgreen" data-theme="lightgreen" title="옅은 연두색 테마" aria-label="옅은 연두색 테마"></button>
     <button type="button" class="theme-swatch theme-sky" data-theme="sky" title="옅은 하늘색 테마 (#D8E7ED)" aria-label="옅은 하늘색 테마"></button>
     <button type="button" class="theme-swatch theme-gray" data-theme="gray" title="회색 테마" aria-label="회색 테마"></button>
     <button type="button" id="clearThemeBtn" class="theme-clear" title="테마 지우기">해제</button>
    </div>
   </div>
   <div class="formula-bar">
    <span id="cellRef" class="cell-ref" aria-label="선택된 셀">A1</span>
    <span class="fx-label" aria-hidden="true">fx</span>
    <div class="formula-input-wrap"><input id="formulaInput" type="text" autocomplete="off" spellcheck="false" aria-label="셀 수식 또는 값" placeholder="값 또는 수식 입력 (예: =A1+B1, =SUM(A1:A5))"></div>
   </div>
  </div>
  <div id="sheetWrap" class="sheet-wrap" tabindex="0" aria-label="Money 스프레드시트"></div>
  <div class="sheet-tabs-bar">
   <div id="sheetTabs" class="sheet-tabs" role="tablist" aria-label="시트 목록"></div>
   <div id="sheetTabActions" class="sheet-tab-actions">
    <button id="moveSheetLeftBtn" type="button" title="현재 시트 왼쪽으로 이동" aria-label="시트 왼쪽으로 이동">◀</button>
    <button id="moveSheetRightBtn" type="button" title="현재 시트 오른쪽으로 이동" aria-label="시트 오른쪽으로 이동">▶</button>
    <button id="addSheetBtn" type="button" title="새 시트 추가" aria-label="+ 시트"><span class="sheet-action-full">+ 시트</span><span class="sheet-action-compact" aria-hidden="true">+</span></button>
    <button id="renameSheetBtn" type="button" title="현재 시트 제목 변경" aria-label="시트 제목 변경"><span class="sheet-action-full">제목</span><span class="sheet-action-compact" aria-hidden="true">제목</span></button>
    <button id="delSheetBtn" type="button" class="danger" title="현재 시트 삭제" aria-label="시트 삭제"><span class="sheet-action-full">시트 삭제</span><span class="sheet-action-compact" aria-hidden="true">삭제</span></button>
   </div>
  </div>
 </section>
</main>
<script id="vault-pure" src="pure.js"></script>
<script src="app.js"></script>
</body>
</html>
