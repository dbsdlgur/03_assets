<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="format-detection" content="telephone=no,email=no,address=no,date=no">
<title>Money</title>
<link rel="stylesheet" href="template.css">
</head>
<body>
<main class="sheet-main">
 <header class="app-header">
  <div class="top">
   <div class="tab-bar">
    <div role="tablist" aria-label="메뉴">
     <button role="tab" id="tab-money" aria-controls="panel-money" aria-selected="true" data-tab="money">Money</button>
    </div>
   </div>
   <div class="save-meta">
    <span id="updatedAt"></span>
    <span id="saveStatus" role="status" aria-live="polite" hidden></span>
   </div>
   <div class="actions"><button id="saveBtn" type="button" class="primary">저장</button></div>
  </div>
 </header>
 <section role="tabpanel" id="panel-money" aria-labelledby="tab-money" class="money-panel">
  <div class="sheet-toolbar">
   <div class="formula-bar">
    <span id="cellRef" class="cell-ref" aria-label="선택된 셀">A1</span>
    <span class="fx-label" aria-hidden="true">fx</span>
    <input id="formulaInput" type="text" autocomplete="off" spellcheck="false" aria-label="셀 수식 또는 값" placeholder="값 또는 수식 입력 (예: =A1+B1, =SUM(A1:A5))">
   </div>
   <div class="sheet-actions" role="toolbar" aria-label="행과 열 편집">
    <button id="addRowBtn" type="button">+ 행</button>
    <button id="addColBtn" type="button">+ 열</button>
    <button id="delRowBtn" type="button">행 삭제</button>
    <button id="delColBtn" type="button">열 삭제</button>
    <button id="clearCellBtn" type="button">지우기</button>
   </div>
  </div>
  <div id="sheetWrap" class="sheet-wrap" tabindex="0" aria-label="Money 스프레드시트"></div>
  <div class="sheet-tabs-bar">
   <div id="sheetTabs" class="sheet-tabs" role="tablist" aria-label="시트 목록"></div>
   <div class="sheet-tab-actions">
    <button id="addSheetBtn" type="button" title="새 시트 추가">+ 시트</button>
    <button id="renameSheetBtn" type="button" title="현재 시트 이름 변경">이름 변경</button>
    <button id="delSheetBtn" type="button" class="danger" title="현재 시트 삭제">시트 삭제</button>
   </div>
  </div>
 </section>
</main>
<script id="vault-pure" src="pure.js"></script>
<script src="app.js"></script>
</body>
</html>
